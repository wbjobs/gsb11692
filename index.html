<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流体 / 烟雾模拟 — Stable Fluids</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0f14; color: #d7dce4;
    font: 14px/1.5 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; min-height: 100vh; padding: 20px; gap: 20px;
  }
  #view {
    border-radius: 8px; background: #000; cursor: crosshair;
    box-shadow: 0 0 40px rgba(255, 120, 40, .08);
    touch-action: none; align-self: center;
  }
  #panel {
    width: 300px; flex-shrink: 0; background: #161a22;
    border: 1px solid #262c38; border-radius: 10px; padding: 18px;
    display: flex; flex-direction: column; gap: 14px;
  }
  h1 { font-size: 17px; font-weight: 600; color: #f0f3f8; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #7b8494; }
  label { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
  input[type=range] { flex: 1; accent-color: #ff7a2f; }
  select, button {
    background: #1f2530; color: #d7dce4; border: 1px solid #333c4c;
    border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer;
  }
  button:hover { background: #28303e; }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }
  .stats { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
  .stats dt { color: #7b8494; }
  .stats dd { font-variant-numeric: tabular-nums; text-align: right; }
  #degraded { color: #ffb454; font-size: 12px; min-height: 16px; }
  .hint { font-size: 12px; color: #5c6575; }
  .val { color: #8b93a3; font-size: 12px; min-width: 44px; text-align: right; }
</style>
</head>
<body>
<canvas id="view" width="720" height="720"></canvas>

<div id="panel">
  <h1>流体 / 烟雾模拟</h1>
  <p class="hint">按住鼠标拖动注入烟雾与推力。Stable Fluids (半拉格朗日 + 压力投影), 模拟在 Web Worker, 渲染用 WebGL。</p>

  <h2>网格</h2>
  <label>分辨率
    <select id="resolution">
      <option value="64">64 × 64</option>
      <option value="96">96 × 96</option>
      <option value="128" selected>128 × 128</option>
      <option value="192">192 × 192</option>
      <option value="256">256 × 256</option>
    </select>
  </label>
  <label><input type="checkbox" id="autoDegrade" checked> FPS 低时自动降级</label>

  <h2>参数</h2>
  <label>粘度 <input type="range" id="viscosity" min="0" max="0.001" step="0.00002" value="0.0001"></label>
  <label>扩散 <input type="range" id="diffusion" min="0" max="0.0005" step="0.00001" value="0.00001"></label>
  <label>推力 <input type="range" id="force" min="1" max="30" step="0.5" value="8"></label>
  <label>染料 <input type="range" id="dye" min="0.1" max="3" step="0.1" value="1.2"></label>
  <label><input type="checkbox" id="vorticity" checked> 涡度增强</label>

  <div class="row">
    <button id="pause">暂停</button>
    <button id="clear">清空</button>
  </div>

  <h2>性能</h2>
  <dl class="stats">
    <dt>FPS</dt><dd id="fps">—</dd>
    <dt>模拟耗时/步</dt><dd id="simMs">—</dd>
    <dt>网格规模</dt><dd id="grid">—</dd>
    <dt>求解器内存</dt><dd id="mem">—</dd>
    <dt>渲染后端</dt><dd id="renderMode">—</dd>
    <dt>长任务(>50ms)</dt><dd id="longtasks">0</dd>
    <dt>累计步数</dt><dd id="steps">0</dd>
  </dl>
  <div id="degraded"></div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
